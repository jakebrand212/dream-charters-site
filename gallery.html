<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<body data-page="gallery">
<div id="site-header"></div>

<!-- The h1 deliberately carries .eyebrow, not hero-h1 sizing: it is the page's
     only heading and has to exist for SEO and screen readers, but Tyler wants
     the small label look. .page-hero .eyebrow (0,2,0) outranks .page-hero h1
     (0,1,1), so colour/size/tracking all still come from .eyebrow — the tag
     swap is visually a no-op. Padding trimmed from the default 60px because a
     one-line label in a 60px band read as an empty navy bar. -->
<section class="page-hero" style="padding:26px 0">
  <img class="page-hero__img" src="assets/paragon.png" alt="G23 Paragon on Canyon Lake">
  <div class="wrap">
    <h1 class="eyebrow">The gallery</h1>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="gallery">
      <figure>
        <img src="assets/centurion.png" alt="Centurion Ri237 flagship wakeboat on Lake Travis" loading="lazy">
        <figcaption>Centurion Ri237 — our Lake Travis flagship</figcaption>
      </figure>
      <figure>
        <img src="assets/nautique-g23.png" alt="Nautique G23 wakeboat cruising Lake Travis" loading="lazy">
        <figcaption>Nautique G23 — smooth rides, big shade</figcaption>
      </figure>
      <figure>
        <img src="assets/nautique-230.png" alt="Nautique 230 wakeboat on Lake Travis" loading="lazy">
        <figcaption>Nautique 230 — the OG, legendary wake</figcaption>
      </figure>
      <figure>
        <img src="assets/paragon.png" alt="G23 Paragon wakeboat on Canyon Lake" loading="lazy">
        <figcaption>G23 Paragon — best wave in the industry</figcaption>
      </figure>
      <figure>
        <img src="assets/sunset-tubing.webp" alt="Tubing behind the boat at sunset on Lake Travis" loading="lazy">
        <figcaption>Golden hour tubing on Lake Travis</figcaption>
      </figure>
      <figure>
        <img src="assets/review-family.jpg" alt="A family with kids in life jackets on a Lake Travis charter" loading="lazy">
        <figcaption>Family days — kids tube, everyone surfs</figcaption>
      </figure>
      <figure>
        <img src="assets/review-taylor-cross.jpg" alt="A big group celebrating a bachelor and bachelorette trip on the boat" loading="lazy">
        <figcaption>Room for the whole crew</figcaption>
      </figure>
      <figure>
        <img src="assets/review-ryan-knop.jpg" alt="A group of friends relaxing under the tower on Lake Travis" loading="lazy">
        <figcaption>Good crews, good vibes</figcaption>
      </figure>
    </div>
    <div class="center" style="margin-top:30px"><a class="btn btn-primary btn-lg" href="https://book.squareup.com/appointments/le7ady9q3649w9/location/LFRJ1VVM5ZY8J/services" target="_blank" rel="noopener noreferrer">Book your day on the water</a></div>
  </div>
</section>

<div id="site-footer"></div>
